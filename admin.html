
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Admin Panel</title>
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
    <header class="header">
        <a href="./index.html" class="logo">Uzum Admin</a>
        <a href="./index.html" class="back">← Saytga qaytish</a>
    </header>
    <main class="container">
        <h1>Admin panel</h1>
        <p class="subtitle">Mahsulotlarni boshqarish</p>
        <section class="form-box">
            <h2 id="form-title">Yangi mahsulot qo‘shish</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <label>Mahsulot nomi</label>
                <input type="text" id="title" placeholder="Mahsulot nomini kiriting" required>
                <label>Narxi</label>
                <input type="number" id="price" placeholder="Narxini kiriting" min="0" required>
                <label>Rasm URL manzili</label>
                <input type="url" id="thumbnail" placeholder="https://example.com/image.jpg" required>
                <label>Tavsif</label>
                <textarea id="description" placeholder="Mahsulot haqida ma'lumot" required></textarea>
                <div class="form-buttons">
                    <button type="submit" id="submit-btn">Mahsulot qo‘shish</button>
                    <button type="button" id="cancel-btn" hidden>Bekor qilish</button>
                </div>
            </form>
        </section>
        <section class="products-section">
            <div class="section-top">
                <h2>Mahsulotlar</h2>
                <span id="product-count">0 ta mahsulot</span>
            </div>
            <div id="products-list" class="products-list"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>
